name: ffmpeg-builder

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEBUG: "0"
  HEADLESS: "1"
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DOCKER_REGISTRY_USER: ${{ github.actor }}
  DOCKER_REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}

permissions:
  packages: write
  contents: read

jobs:
  base-image:
    name: base image ${{ matrix.distro }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        distro: [ubuntu, fedora, debian, archlinux]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: gitignore/docker
          key: docker-deps-${{ hashFiles('lib/docker.sh') }}
      - name: build and push base image
        run: ./scripts/docker_build_image.sh ${{ matrix.distro }}
        env:
          PLATFORM: ${{ matrix.platform }}

  base-image-manifest:
    name: merge multiarch base images
    needs: base-image
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: merge platform legs into multiarch tags
        run: |
          : > "${RUNNER_TEMP}/merged_distros"
          for d in ubuntu fedora debian archlinux; do
            amd64="$DOCKER_REGISTRY/ffmpeg_builder_${d}-amd64"
            arm64="$DOCKER_REGISTRY/ffmpeg_builder_${d}-arm64"
            if docker buildx imagetools inspect "${amd64}" >/dev/null 2>&1 && \
               docker buildx imagetools inspect "${arm64}" >/dev/null 2>&1; then
              echo "merging platform legs for ${d}"
              docker buildx imagetools create \
                -t "$DOCKER_REGISTRY/ffmpeg_builder_$d" \
                "${amd64}" "${arm64}"
              echo "${d}" >> "${RUNNER_TEMP}/merged_distros"
            else
              echo "skip: no fresh platform legs for ${d} (cached build?)"
            fi
          done
      - name: delete single-platform leg packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for d in $(cat "${RUNNER_TEMP}/merged_distros"); do
            for suf in amd64 arm64; do
              pkg="ffmpeg_builder_${d}-${suf}"
              echo "removing single-platform package ${pkg}"
              gh api -X DELETE "/user/packages/container/${pkg}" || \
                echo "warn: failed to delete ${pkg}"
            done
          done

  download-releases:
    name: download all releases
    needs: base-image-manifest
    runs-on: ubuntu-26.04
    outputs:
      dl_key: ${{ steps.dk.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - name: compute downloads cache key
        id: dk
        run: |
          hash="$({ ./scripts/entry.sh get_build_conf BUILDS_CONF; } | \
            python3 -c 'import hashlib,sys;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          echo "key=downloads-${hash}" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        with:
          path: gitignore/downloads
          key: ${{ steps.dk.outputs.key }}
          restore-keys: downloads-
      - name: download all releases
        run: ./scripts/docker_run_image.sh ubuntu ./scripts/download_all_releases.sh

  darwin:
    name: darwin arm64 (${{ matrix.comp_opts }})
    needs: download-releases
    runs-on: macos-latest
    strategy:
      matrix:
        comp_opts:
          - "OPT=0 LTO=OFF STATIC=OFF"
          - "OPT=2 LTO=OFF"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: gitignore/downloads
          key: ${{ needs.download-releases.outputs.dl_key }}
          restore-keys: downloads-
      - name: install bash 5
        run: brew install bash
      - name: install dependencies
        run: |
          export PATH="/opt/homebrew/bin:${PATH}"
          ./scripts/install_deps.sh
      - name: build ffmpeg
        run: |
          export PATH="/opt/homebrew/bin:${PATH}"
          ${{ matrix.comp_opts }} ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          path: gitignore/package/*.tar.xz
          if-no-files-found: ignore

  linux:
    name: linux ${{ matrix.arch }} ${{ matrix.distro }} (${{ matrix.comp_opts }})
    needs: [download-releases, base-image-manifest]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch:
          - x86-64-v3
          - armv8-a
        distro:
          - ubuntu
          - fedora
          - debian
          - archlinux
        comp_opts:
          - "OPT=0 LTO=OFF STATIC=OFF"
          - "OPT=2 LTO=OFF"
        include:
          - arch: x86-64-v3
            runner: ubuntu-26.04
          - arch: armv8-a
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: gitignore/downloads
          key: ${{ needs.download-releases.outputs.dl_key }}
          restore-keys: downloads-
      - name: build ffmpeg with docker
        run: ${{ matrix.comp_opts }} ./scripts/build_with_docker.sh ${{ matrix.distro }}
        env:
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          path: gitignore/package/*.tar.xz
          if-no-files-found: ignore